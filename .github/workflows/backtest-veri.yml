name: Backtest fiyat verisi

on:
  push:
    paths:
      - "backtest/fetch_prices.py"
      - ".github/workflows/backtest-veri.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest-veri
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneler
        run: pip install yfinance pandas
      - name: Fiyatlari cek
        run: python backtest/fetch_prices.py
      - name: Depoya yaz
        run: |
          git config user.name "hisse-veri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtest/data
          git diff --cached --quiet && exit 0
          git commit -m "backtest fiyat verisi $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
